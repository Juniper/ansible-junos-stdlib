---
- ansible.builtin.debug:
    msg:
      START junos_interfaces round trip integration tests on connection={{ ansible_connection
      }}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.set_fact:
    expected_revert_output:
      - name: ge-0/0/1
        description: Configured by Ansible - Interface 1
        mtu: 1024
        enabled: false
        duplex: full-duplex
        vlan_tagging: false
        hold_time:
          up: 2000
          down: 2200

      - name: ge-0/0/2
        description: Configured by Ansible - Interface 2
        mtu: 2048
        enabled: true
        vlan_tagging: false
        hold_time:
          up: 3000
          down: 3200

- name: Expect speeds and fxp0 on classic Junos
  ansible.builtin.set_fact:
    expected_revert_output: >-
      {{ [expected_revert_output[0] | combine({'speed': '100m'}),
          expected_revert_output[1] | combine({'speed': '10m'}),
          {'name': 'fxp0', 'enabled': true, 'vlan_tagging': false}] }}
  when: not is_evo

- block:
    - name: Apply the provided configuration (base config)
      register: base_config
      junipernetworks.junos.junos_interfaces:
        config:
          - name: ge-0/0/1
            description: Configured by Ansible - Interface 1
            mtu: 1024
            speed: "{{ omit if is_evo else '100m' }}"
            enabled: false
            duplex: full-duplex
            hold_time:
              up: 2000
              down: 2200

          - name: ge-0/0/2
            description: Configured by Ansible - Interface 2
            mtu: 2048
            speed: "{{ omit if is_evo else '10m' }}"
            enabled: true
            hold_time:
              up: 3000
              down: 3200
        state: merged

    - name: Gather interfaces facts
      junipernetworks.junos.junos_facts:
        gather_subset:
          - default
        gather_network_resources:
          - interfaces

    - name: Apply the provided configuration (config to be reverted)
      register: result
      junipernetworks.junos.junos_interfaces:
        config:
          - name: ge-0/0/1
            description: Configured by Ansible - Interface 1 modified
            mtu: 3048
            speed: "{{ omit if is_evo else '10m' }}"
            enabled: true
            duplex: "{{ omit if is_evo else 'half-duplex' }}"
            hold_time:
              up: 3000
              down: 2200

          - name: ge-0/0/2
            description: Configured by Ansible - Interface 2 modified
            mtu: 4048
            speed: "{{ omit if is_evo else '100m' }}"
            enabled: false
            hold_time:
              up: 4000
              down: 5200
        state: merged

    - name: Assert that changes were applied
      ansible.builtin.assert:
        that: result['changed'] == true

    - name: Revert back to base config using facts round trip
      register: revert
      vars:
        facts_interfaces: "{{ ansible_facts['network_resources']['interfaces'] }}"
      junipernetworks.junos.junos_interfaces:
        config: >-
          {{ facts_interfaces | selectattr('name', 'in', ['ge-0/0/1', 'ge-0/0/2']) | list
             if is_evo else facts_interfaces }}
        state: replaced

    - name: Assert that config was reverted
      vars:
        after_interfaces: >-
          {{ revert['after'] | selectattr('name', 'in', ['ge-0/0/1', 'ge-0/0/2']) | list
             if is_evo else revert['after'] }}
      ansible.builtin.assert:
        that:
          "{{ expected_revert_output | symmetric_difference(after_interfaces)\
          \ |length == 0 }}"
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
