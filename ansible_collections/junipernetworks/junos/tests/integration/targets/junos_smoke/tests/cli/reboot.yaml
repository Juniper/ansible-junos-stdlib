---
- ansible.builtin.debug:
    msg: START cli/cli_reboot.yaml on connection={{ ansible_connection }}
- block:
    - ansible.netcommon.cli_command:
        command: request system reboot
        prompt:
          - Reboot the system?
          - do you wish to continue\?
        answer:
          - y
          - "yes"

      tags:
        - reboot
    - wait_for_connection:
        delay: 60
        sleep: 40

    - name: Reset ansible connection
      meta: reset_connection

    - name: show version
      block:
        - ansible.netcommon.cli_command:
            command: show version
          register: result
      rescue:
        # A session opened while the device is still booting stays dead, so `until` retries cannot recover.
        - name: Wait for the CLI to finish starting
          ansible.builtin.pause:
            seconds: 60

        - name: Reset ansible connection
          meta: reset_connection

        - name: show version (retry on a new connection)
          ansible.netcommon.cli_command:
            command: show version
          register: result
          until: result is succeeded
          retries: 5
          delay: 30
  when: ansible_connection == 'ansible.netcommon.network_cli'

- ansible.builtin.debug: msg="END cli/reboot.yaml on connection={{ ansible_connection }}"
