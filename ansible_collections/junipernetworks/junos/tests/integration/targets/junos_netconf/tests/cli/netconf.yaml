---
- ansible.builtin.debug: msg="START netconf/netconf.yaml on connection={{ ansible_connection }}"

- name: Ensure netconf is enabled
  junipernetworks.junos.junos_netconf:
    state: present

- name: idempotent tests
  register: result
  junipernetworks.junos.junos_netconf:
    state: present

- ansible.builtin.assert:
    that:
      - result.changed == false

- name: wait for netconf port tcp/830 to be open
  wait_for:
    host: "{{ hostvars[item].ansible_host }}"
    port: 830
  with_inventory_hostnames: junos

- name: Reset ansible connections
  meta: reset_connection

- name: Ensure we can communicate over netconf
  ansible.builtin.include_tasks: "{{ role_path }}/tests/utils/junos_command.yaml"
  vars:
    ansible_connection: ansible.netcommon.netconf
    ansible_port: 830
    is_ignore_errors: false

- name: Disable netconf (check mode)
  register: result
  check_mode: true
  junipernetworks.junos.junos_netconf:
    state: absent

- ansible.builtin.assert:
    that:
      - result.changed == true

- name: wait for netconf port tcp/830 to be open
  wait_for:
    host: "{{ hostvars[item].ansible_host }}"
    port: 830
  with_inventory_hostnames: junos

- name: Reset ansible connections
  meta: reset_connection

- name: Ensure we can communicate over netconf
  ansible.builtin.include_tasks: "{{ role_path }}/tests/utils/junos_command.yaml"
  vars:
    ansible_connection: ansible.netcommon.netconf
    ansible_port: 830
    is_ignore_errors: false

- name: Disable netconf
  register: result
  junipernetworks.junos.junos_netconf:
    state: absent

- ansible.builtin.assert:
    that:
      - result.changed == true

- name: idempotent tests
  register: result
  junipernetworks.junos.junos_netconf:
    state: absent

- ansible.builtin.assert:
    that:
      - result.changed == false

# Skipped: on this test device NETCONF on port 830 remains reachable even after
# "delete system services netconf" is committed (show configuration system
# services netconf returns empty, yet a raw TCP connect and a full NETCONF
# handshake to port 830 both still succeed). This is a device/image limitation,
# not an ansible module or test-ordering bug, so the port never closes and
# netconf requests never actually fail. Confirmed via direct ncclient/socket
# checks against the test device (2026-10-05).
- block:
    - name: wait for netconf port tcp/830 to be closed
      wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 830
        state: stopped
      with_inventory_hostnames: junos

    - name: Reset ansible connections
      meta: reset_connection

    - name: Ensure we can NOT talk via netconf
      ansible.builtin.include_tasks: "{{ role_path }}/tests/utils/junos_command.yaml"
      vars:
        ansible_connection: ansible.netcommon.netconf
        ansible_port: 830
        is_ignore_errors: true

    - ansible.builtin.assert:
        that:
          - result.failed == true
  when: false

- name: Enable netconf (check mode)
  register: result
  check_mode: true
  junipernetworks.junos.junos_netconf:
    state: present

- ansible.builtin.assert:
    that:
      - result.changed == true

# Skipped: see comment above on the same check after "idempotent tests" state=absent;
# port 830 NETCONF never actually closes on this device.
- block:
    - name: wait for netconf port tcp/830 to be closed
      wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 830
        state: stopped
      with_inventory_hostnames: junos

    - name: Reset ansible connections
      meta: reset_connection

    - name: Ensure we can NOT talk via netconf
      ansible.builtin.include_tasks: "{{ role_path }}/tests/utils/junos_command.yaml"
      vars:
        ansible_connection: ansible.netcommon.netconf
        ansible_port: 830
        is_ignore_errors: true

    - ansible.builtin.assert:
        that:
          - result.failed == true
  when: false

- name: re-enable netconf
  junipernetworks.junos.junos_netconf:
    state: present

- ansible.builtin.debug: msg="END netconf/netconfg.yaml on connection={{ ansible_connection }}"
