---
- ansible.builtin.debug:
    msg:
      START junos_interfaces merged integration tests on connection={{ ansible_connection
      }}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _initial_config.yaml

- ansible.builtin.set_fact:
    expected_merged_output:
      - name: ge-0/0/1
        description: Configured by Ansible - Interface 1
        mtu: 1024
        enabled: false
        duplex: full-duplex
        vlan_tagging: false
        hold_time:
          up: 2000
          down: 2200

      - name: ge-0/0/2
        description: Configured by Ansible - Interface 2
        mtu: 2048
        enabled: true
        vlan_tagging: false
        hold_time:
          up: 3000
          down: 3200

      - enabled: true
        name: fe-0/0/2
        vlan_tagging: true
        units:
          - description: "This is logical interface UNIT 10"
            name: 10
            vlan_id: 10
          - description: "This is logical interface UNIT 11"
            name: 11
            vlan_id: 11

- name: Expect speeds and fxp0 on classic Junos
  ansible.builtin.set_fact:
    expected_merged_output: >-
      {{ [expected_merged_output[0] | combine({'speed': '100m'}),
          expected_merged_output[1] | combine({'speed': '10m'}),
          expected_merged_output[2],
          {'name': 'fxp0', 'enabled': true, 'vlan_tagging': false}] }}
  when: not is_evo

- block:
    - name: Merge the provided configuration with the exisiting running configuration
      register: result
      junipernetworks.junos.junos_interfaces: &id001
        config:
          - name: ge-0/0/1
            description: Configured by Ansible - Interface 1
            mtu: 1024
            speed: "{{ omit if is_evo else '100m' }}"
            enabled: false
            duplex: full-duplex
            hold_time:
              up: 2000
              down: 2200

          - name: ge-0/0/2
            description: Configured by Ansible - Interface 2
            mtu: 2048
            speed: "{{ omit if is_evo else '10m' }}"
            hold_time:
              up: 3000
              down: 3200
          - name: fe-0/0/2
            units:
              - name: 10
                description: "This is logical interface UNIT 10"
              - name: 11
                description: "This is logical interface UNIT 11"
        state: merged

    - name: Assert the configuration is reflected on host
      vars:
        after_interfaces: >-
          {{ result['after'] | selectattr('name', 'in', ['ge-0/0/1', 'ge-0/0/2', 'fe-0/0/2']) | list
             if is_evo else result['after'] }}
      ansible.builtin.assert:
        that:
          - "{{ expected_merged_output | symmetric_difference(after_interfaces) |length\
            \ == 0 }}"

    - name:
        Merge the provided configuration with the existing running configuration
        (IDEMPOTENT)
      register: result
      junipernetworks.junos.junos_interfaces: *id001

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.debug:
    msg:
      END junos_interfaces merged integration tests on connection={{ ansible_connection
      }}
