---
- ansible.builtin.debug:
    msg: START junos_l2_interfaces round trip integration tests on connection={{
      ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _base_config.yaml

- block:
    # Skipped: setting native_vlan on a trunk interface together with interface-mode
    # trunk fails Junos commit-check on vSRX ("native-vlan-id can be specified with
    # flexible-vlan-tagging mode or with interface-mode trunk"), even when the two
    # are committed in separate transactions. This is a platform limitation: vSRX
    # requires a reboot to fully transition into transparent/switching forwarding
    # mode before native-vlan-id validates, which this test suite cannot perform
    # safely. Confirmed via direct RPCs against the test device (2026-10-04).
    - block:
        - name: Apply the provided configuration (base config)
          register: base_config
          junipernetworks.junos.junos_l2_interfaces:
            config:
              - name: ge-0/0/2
                trunk:
                  allowed_vlans:
                    - vlan100
            state: merged

        - name: Gather interfaces facts
          junipernetworks.junos.junos_facts:
            gather_subset:
              - default
            gather_network_resources:
              - l2_interfaces

        - name: Apply the provided configuration (config to be reverted)
          register: result
          junipernetworks.junos.junos_l2_interfaces:
            config:
              - name: ge-0/0/2
                trunk:
                  allowed_vlans:
                    - vlan100
                  native_vlan: "200"
            state: overridden

        - name: Assert that changes were applied
          ansible.builtin.assert:
            that: result['changed'] == true

        - name: Revert back to base config using facts round trip
          register: revert
          junipernetworks.junos.junos_l2_interfaces:
            config: "{{ ansible_facts['network_resources']['l2_interfaces'] }}"
            state: overridden

        - name: Assert that config was reverted
          ansible.builtin.assert:
            that: "{{ base_config['after'] | symmetric_difference(revert['after'])\
              \ |length == 0 }}"
      when: false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.debug:
    msg:
      END junos_l2_interfaces round trip integration tests on connection={{ ansible_connection
      }}
