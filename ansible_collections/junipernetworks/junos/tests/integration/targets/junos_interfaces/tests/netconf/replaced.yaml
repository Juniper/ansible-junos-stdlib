---
- ansible.builtin.debug:
    msg:
      START junos_interfaces replaced integration tests on connection={{ ansible_connection
      }}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.set_fact:
    expected_replaced_output:
      - name: ge-0/0/1
        description: Replaced by Ansible - Interface 1
        mtu: 2048
        enabled: true
        vlan_tagging: false

      - name: ge-0/0/2
        description: Configured by Ansible - Interface 2
        mtu: 2048
        enabled: true
        vlan_tagging: false
        hold_time:
          up: 3000
          down: 3200

- name: Expect speeds and fxp0 on classic Junos
  ansible.builtin.set_fact:
    expected_replaced_output: >-
      {{ [expected_replaced_output[0] | combine({'speed': '10m'}),
          expected_replaced_output[1] | combine({'speed': '10m'}),
          {'name': 'fxp0', 'enabled': true, 'vlan_tagging': false}] }}
  when: not is_evo

- block:
    - name: Configure initial state for interface
      register: result
      junipernetworks.junos.junos_interfaces:
        config:
          - name: ge-0/0/1
            description: Configured by Ansible - Interface 1
            mtu: 1024
            speed: "{{ omit if is_evo else '100m' }}"
            enabled: false
            duplex: full-duplex
            hold_time:
              up: 2000
              down: 2200

          - name: ge-0/0/2
            description: Configured by Ansible - Interface 2
            mtu: 2048
            speed: "{{ omit if is_evo else '10m' }}"
            hold_time:
              up: 3000
              down: 3200
        state: merged

    - name: Replace the provided configuration with the exisiting running configuration
      register: result
      junipernetworks.junos.junos_interfaces: &id001
        config:
          - name: ge-0/0/1
            description: Replaced by Ansible - Interface 1
            mtu: 2048
            speed: "{{ omit if is_evo else '10m' }}"
            enabled: true
        state: replaced

    - name: Assert the configuration is reflected on host
      vars:
        after_interfaces: >-
          {{ result['after'] | selectattr('name', 'in', ['ge-0/0/1', 'ge-0/0/2']) | list
             if is_evo else result['after'] }}
      ansible.builtin.assert:
        that:
          - "{{ expected_replaced_output | symmetric_difference(after_interfaces)\
            \ |length == 0 }}"

    - name:
        Replace the provided configuration with the existing running configuration
        (IDEMPOTENT)
      register: result
      junipernetworks.junos.junos_interfaces: *id001

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.debug:
    msg:
      END junos_interfaces replaced integration tests on connection={{ ansible_connection
      }}
